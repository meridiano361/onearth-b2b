<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#2c1654"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <radialGradient id="moon" cx="70%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#f8f0d0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f8f0d0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background notturno -->
  <rect width="400" height="400" fill="url(#bg50)"/>
  <rect width="400" height="400" fill="url(#moon)"/>

  <!-- Stelle nel cielo -->
  <circle cx="30" cy="25" r="1.5" fill="white" fill-opacity="0.9"/>
  <circle cx="70" cy="15" r="1" fill="white" fill-opacity="0.7"/>
  <circle cx="110" cy="35" r="1.5" fill="white" fill-opacity="0.8"/>
  <circle cx="160" cy="10" r="1" fill="white" fill-opacity="0.9"/>
  <circle cx="220" cy="30" r="2" fill="white" fill-opacity="0.8"/>
  <circle cx="270" cy="12" r="1" fill="white" fill-opacity="0.7"/>
  <circle cx="310" cy="45" r="1.5" fill="white" fill-opacity="0.9"/>
  <circle cx="350" cy="20" r="1" fill="white" fill-opacity="0.6"/>
  <circle cx="380" cy="40" r="1.5" fill="white" fill-opacity="0.8"/>
  <circle cx="50" cy="70" r="1" fill="white" fill-opacity="0.5"/>
  <circle cx="140" cy="60" r="1.5" fill="white" fill-opacity="0.7"/>
  <circle cx="190" cy="75" r="1" fill="white" fill-opacity="0.6"/>
  <circle cx="340" cy="65" r="1.5" fill="white" fill-opacity="0.8"/>
  <circle cx="390" cy="75" r="1" fill="white" fill-opacity="0.5"/>

  <!-- Luna -->
  <circle cx="320" cy="70" r="40" fill="#f8f0d0" fill-opacity="0.12"/>
  <circle cx="320" cy="70" r="28" fill="#f8f0d0" fill-opacity="0.08"/>

  <!-- Case innevate (skyline) -->
  <!-- Colline neve -->
  <ellipse cx="80" cy="400" rx="120" ry="60" fill="#e8f4f8" fill-opacity="0.15"/>
  <ellipse cx="320" cy="400" rx="130" ry="70" fill="#e8f4f8" fill-opacity="0.12"/>
  <ellipse cx="200" cy="420" rx="200" ry="80" fill="#e8f4f8" fill-opacity="0.18"/>

  <!-- Casa 1 -->
  <rect x="30" y="280" width="70" height="80" fill="#2c1654"/>
  <polygon points="30,280 65,240 100,280" fill="#1a0a2e"/>
  <rect x="48" y="295" width="18" height="25" fill="#f1c40f" fill-opacity="0.6"/>
  <rect x="72" y="300" width="14" height="20" fill="#f1c40f" fill-opacity="0.5"/>
  <!-- Neve sul tetto -->
  <rect x="28" y="278" width="74" height="8" rx="4" fill="white" fill-opacity="0.7"/>

  <!-- Casa 2 -->
  <rect x="120" y="300" width="50" height="60" fill="#1e1040"/>
  <polygon points="120,300 145,265 170,300" fill="#120828"/>
  <rect x="130" y="310" width="14" height="20" fill="#f1c40f" fill-opacity="0.7"/>
  <rect x="149" y="315" width="12" height="18" fill="#e74c3c" fill-opacity="0.4"/>
  <rect x="118" y="298" width="54" height="7" rx="3.5" fill="white" fill-opacity="0.7"/>

  <!-- Chiesa (centro) -->
  <rect x="170" y="255" width="60" height="105" fill="#2c1654"/>
  <polygon points="170,255 200,205 230,255" fill="#1a0a2e"/>
  <!-- Campanile -->
  <rect x="192" y="185" width="16" height="25" fill="#1a0a2e"/>
  <polygon points="192,185 200,168 208,185" fill="#1a0a2e"/>
  <!-- Croce -->
  <rect x="198" y="170" width="4" height="15" fill="#f1c40f" fill-opacity="0.8"/>
  <rect x="194" y="175" width="12" height="3" fill="#f1c40f" fill-opacity="0.8"/>
  <!-- Finestra rosone -->
  <circle cx="200" cy="238" r="14" fill="#f1c40f" fill-opacity="0.3"/>
  <circle cx="200" cy="238" r="9" fill="#f1c40f" fill-opacity="0.2"/>
  <!-- Porta -->
  <rect x="188" y="320" width="24" height="40" rx="12" fill="#f1c40f" fill-opacity="0.4"/>
  <rect x="168" y="253" width="64" height="7" rx="3.5" fill="white" fill-opacity="0.7"/>

  <!-- Casa 3 -->
  <rect x="250" y="295" width="55" height="65" fill="#2c1654"/>
  <polygon points="250,295 277,255 305,295" fill="#1a0a2e"/>
  <rect x="258" y="308" width="15" height="22" fill="#f1c40f" fill-opacity="0.6"/>
  <rect x="278" y="312" width="13" height="18" fill="#e74c3c" fill-opacity="0.4"/>
  <rect x="248" y="293" width="59" height="7" rx="3.5" fill="white" fill-opacity="0.7"/>

  <!-- Casa 4 -->
  <rect x="315" y="275" width="75" height="85" fill="#1a0a2e"/>
  <polygon points="315,275 352,230 390,275" fill="#120820"/>
  <rect x="325" y="290" width="18" height="26" fill="#f1c40f" fill-opacity="0.5"/>
  <rect x="350" y="285" width="16" height="22" fill="#f1c40f" fill-opacity="0.6"/>
  <rect x="313" y="273" width="79" height="8" rx="4" fill="white" fill-opacity="0.7"/>

  <!-- Neve a terra -->
  <rect x="0" y="355" width="400" height="45" fill="white" fill-opacity="0.2"/>
  <rect x="0" y="370" width="400" height="30" rx="15" fill="white" fill-opacity="0.15"/>

  <!-- Fiocchi neve che cadono -->
  <circle cx="45" cy="120" r="2.5" fill="white" fill-opacity="0.6"/>
  <circle cx="90" cy="155" r="1.5" fill="white" fill-opacity="0.5"/>
  <circle cx="155" cy="130" r="2" fill="white" fill-opacity="0.7"/>
  <circle cx="250" cy="110" r="2.5" fill="white" fill-opacity="0.5"/>
  <circle cx="305" cy="145" r="1.5" fill="white" fill-opacity="0.6"/>
  <circle cx="360" cy="120" r="2" fill="white" fill-opacity="0.5"/>
  <circle cx="20" cy="180" r="1.5" fill="white" fill-opacity="0.4"/>
  <circle cx="385" cy="190" r="2" fill="white" fill-opacity="0.4"/>

  <!-- Lucette alle finestre -->
  <path d="M0,100 Q40,90 80,100 Q120,110 160,100 Q200,90 240,100 Q280,110 320,100 Q360,90 400,100" fill="none" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.35"/>
  <circle cx="20" cy="97" r="3" fill="#e74c3c" fill-opacity="0.7"/>
  <circle cx="60" cy="93" r="3" fill="#f1c40f" fill-opacity="0.7"/>
  <circle cx="100" cy="100" r="3" fill="#27ae60" fill-opacity="0.7"/>
  <circle cx="140" cy="106" r="3" fill="#e74c3c" fill-opacity="0.7"/>
  <circle cx="180" cy="97" r="3" fill="#f1c40f" fill-opacity="0.7"/>
  <circle cx="220" cy="93" r="3" fill="#27ae60" fill-opacity="0.7"/>
  <circle cx="260" cy="100" r="3" fill="#e74c3c" fill-opacity="0.7"/>
  <circle cx="300" cy="106" r="3" fill="#f1c40f" fill-opacity="0.7"/>
  <circle cx="340" cy="97" r="3" fill="#27ae60" fill-opacity="0.7"/>
  <circle cx="380" cy="93" r="3" fill="#e74c3c" fill-opacity="0.7"/>
</svg>
