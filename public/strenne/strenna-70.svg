<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg70" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="40%" stop-color="#5d3e0a"/>
      <stop offset="100%" stop-color="#2a1800"/>
    </radialGradient>
    <radialGradient id="shimmer" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f1c40f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f1c40f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background caldo oro scuro -->
  <rect width="400" height="400" fill="url(#bg70)"/>
  <rect width="400" height="400" fill="url(#shimmer)"/>

  <!-- Texture damascata - linee sottili dorate -->
  <line x1="0" y1="80" x2="400" y2="80" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="0" y1="240" x2="400" y2="240" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="80" y1="0" x2="80" y2="400" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="160" y1="0" x2="160" y2="400" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="240" y1="0" x2="240" y2="400" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="320" y1="0" x2="320" y2="400" stroke="#f1c40f" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Cornice elegante -->
  <rect x="15" y="15" width="370" height="370" rx="12" fill="none" stroke="#f1c40f" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="22" y="22" width="356" height="356" rx="9" fill="none" stroke="#f1c40f" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Angoli ornamentali -->
  <!-- Angolo in alto a sinistra -->
  <g transform="translate(15,15)">
    <circle cx="0" cy="0" r="6" fill="#f1c40f" fill-opacity="0.7"/>
    <line x1="0" y1="6" x2="0" y2="20" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="6" y1="0" x2="20" y2="0" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <!-- Angolo in alto a destra -->
  <g transform="translate(385,15)">
    <circle cx="0" cy="0" r="6" fill="#f1c40f" fill-opacity="0.7"/>
    <line x1="0" y1="6" x2="0" y2="20" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-6" y1="0" x2="-20" y2="0" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <!-- Angolo in basso a sinistra -->
  <g transform="translate(15,385)">
    <circle cx="0" cy="0" r="6" fill="#f1c40f" fill-opacity="0.7"/>
    <line x1="0" y1="-6" x2="0" y2="-20" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="6" y1="0" x2="20" y2="0" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <!-- Angolo in basso a destra -->
  <g transform="translate(385,385)">
    <circle cx="0" cy="0" r="6" fill="#f1c40f" fill-opacity="0.7"/>
    <line x1="0" y1="-6" x2="0" y2="-20" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-6" y1="0" x2="-20" y2="0" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Stella a 8 punte centrale (ornamento) -->
  <g transform="translate(200,200)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="70" fill="#f1c40f" fill-opacity="0.06"/>
    <circle cx="0" cy="0" r="50" fill="#f1c40f" fill-opacity="0.08"/>
    <!-- Stella -->
    <polygon points="0,-55 8,-20 35,-35 20,-8 55,0 20,8 35,35 8,20 0,55 -8,20 -35,35 -20,8 -55,0 -20,-8 -35,-35 -8,-20" fill="#f1c40f" fill-opacity="0.9"/>
    <!-- Centro -->
    <circle cx="0" cy="0" r="18" fill="#5d3e0a"/>
    <circle cx="0" cy="0" r="12" fill="#f1c40f" fill-opacity="0.4"/>
  </g>

  <!-- Stelle decorative agli angoli interni -->
  <g transform="translate(70,70)">
    <polygon points="0,-15 3,-6 12,-6 5.5,-1 8,8 0,-4 -8,8 -5.5,-1 -12,-6 -3,-6" fill="#f1c40f" fill-opacity="0.6"/>
  </g>
  <g transform="translate(330,70)">
    <polygon points="0,-15 3,-6 12,-6 5.5,-1 8,8 0,-4 -8,8 -5.5,-1 -12,-6 -3,-6" fill="#f1c40f" fill-opacity="0.6"/>
  </g>
  <g transform="translate(70,330)">
    <polygon points="0,-15 3,-6 12,-6 5.5,-1 8,8 0,-4 -8,8 -5.5,-1 -12,-6 -3,-6" fill="#f1c40f" fill-opacity="0.6"/>
  </g>
  <g transform="translate(330,330)">
    <polygon points="0,-15 3,-6 12,-6 5.5,-1 8,8 0,-4 -8,8 -5.5,-1 -12,-6 -3,-6" fill="#f1c40f" fill-opacity="0.6"/>
  </g>

  <!-- Fiocchi di neve piccoli alle mezzerie -->
  <g transform="translate(200,50)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-8.7" y1="-5" x2="8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="8.7" y1="-5" x2="-8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(200,350)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-8.7" y1="-5" x2="8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="8.7" y1="-5" x2="-8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(50,200)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-8.7" y1="-5" x2="8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="8.7" y1="-5" x2="-8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <g transform="translate(350,200)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="-8.7" y1="-5" x2="8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="8.7" y1="-5" x2="-8.7" y2="5" stroke="#f1c40f" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Pallini d'oro sparsi -->
  <circle cx="120" cy="120" r="4" fill="#f1c40f" fill-opacity="0.4"/>
  <circle cx="280" cy="120" r="3" fill="#f1c40f" fill-opacity="0.3"/>
  <circle cx="120" cy="280" r="3" fill="#f1c40f" fill-opacity="0.4"/>
  <circle cx="280" cy="280" r="4" fill="#f1c40f" fill-opacity="0.3"/>
  <circle cx="200" cy="105" r="2.5" fill="#f1c40f" fill-opacity="0.5"/>
  <circle cx="200" cy="295" r="2.5" fill="#f1c40f" fill-opacity="0.5"/>
</svg>
